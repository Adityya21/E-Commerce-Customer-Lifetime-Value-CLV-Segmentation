<div id="clv-loader" class="clv-loader">
  <div class="clv-loader__stage">
    <svg viewBox="0 0 160 160" class="clv-loader__svg">
      <circle class="dot dot-1" cx="40" cy="50" r="6"></circle>
      <circle class="dot dot-2" cx="70" cy="35" r="6"></circle>
      <circle class="dot dot-3" cx="100" cy="55" r="6"></circle>
      <circle class="dot dot-4" cx="45" cy="90" r="6"></circle>
      <circle class="dot dot-5" cx="80" cy="100" r="6"></circle>
      <circle class="dot dot-6" cx="115" cy="85" r="6"></circle>
      <circle class="dot dot-7" cx="60" cy="120" r="6"></circle>
      <circle class="dot dot-8" cx="100" cy="130" r="6"></circle>
      <circle class="cluster-ring ring-a" cx="55" cy="45" r="26"></circle>
      <circle class="cluster-ring ring-b" cx="95" cy="110" r="28"></circle>
    </svg>
  </div>

  <p class="clv-loader__label">Segmenting customers<span class="clv-loader__dots"><span>.</span><span>.</span><span>.</span></span></p>
  <p class="clv-loader__sublabel">Calculating lifetime value</p>
</div>

<style>
  .clv-loader {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #FAF8F5;
    font-family: 'Plus Jakarta Sans', sans-serif;
    transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
  }

  .clv-loader__stage {
    width: 160px;
    height: 160px;
    margin-bottom: 28px;
  }

  .clv-loader__svg {
    width: 100%;
    height: 100%;
  }

  .dot {
    fill: #A3B18A;
    opacity: 0;
    animation: dotAppear 2.4s ease-in-out infinite;
  }

  .dot-2 { fill: #C9A66B; animation-delay: 0.1s; }
  .dot-3 { animation-delay: 0.2s; }
  .dot-4 { fill: #64748B; animation-delay: 0.3s; }
  .dot-5 { fill: #C9A66B; animation-delay: 0.4s; }
  .dot-6 { animation-delay: 0.5s; }
  .dot-7 { fill: #64748B; animation-delay: 0.6s; }
  .dot-8 { animation-delay: 0.7s; }
  .dot-1 { animation-delay: 0s; }

  .cluster-ring {
    fill: none;
    stroke: #EFE7DA;
    stroke-width: 1.5;
    opacity: 0;
    animation: ringPulse 2.4s ease-in-out infinite;
  }

  .ring-a { animation-delay: 0.8s; }
  .ring-b { animation-delay: 1.1s; }

  @keyframes dotAppear {
    0% { opacity: 0; transform: scale(0.6); }
    25% { opacity: 1; transform: scale(1); }
    75% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(0.6); }
  }

  @keyframes ringPulse {
    0% { opacity: 0; stroke-width: 0.5; }
    40% { opacity: 1; stroke-width: 1.5; }
    80% { opacity: 0.4; stroke-width: 1.5; }
    100% { opacity: 0; stroke-width: 0.5; }
  }

  .clv-loader__label {
    font-size: 15px;
    font-weight: 500;
    color: #2B2B2B;
    margin: 0;
    letter-spacing: 0.01em;
  }

  .clv-loader__dots span {
    animation: dotBlink 1.4s infinite;
    opacity: 0;
  }

  .clv-loader__dots span:nth-child(1) { animation-delay: 0s; }
  .clv-loader__dots span:nth-child(2) { animation-delay: 0.2s; }
  .clv-loader__dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes dotBlink {
    0%, 100% { opacity: 0; }
    50% { opacity: 1; }
  }

  .clv-loader__sublabel {
    font-size: 13px;
    color: #64748B;
    margin: 6px 0 0;
  }

  .clv-loader.is-hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    const loader = document.getElementById('clv-loader');
    
    // Check navigation type to detect a browser refresh
    const navEntries = performance.getEntriesByType("navigation");
    const isReload = navEntries.length > 0 && navEntries[0].type === "reload";
    
    const isFirstTime = !sessionStorage.getItem('hasSeenLoader');
    const isForced = sessionStorage.getItem('forceLoader') === 'true';

    if (isFirstTime || isForced || isReload) {
      setTimeout(function() {
        loader.classList.add('is-hidden');
        sessionStorage.setItem('hasSeenLoader', 'true');
        sessionStorage.removeItem('forceLoader');
      }, 3000);
    } else {
      loader.style.display = 'none';
    }
  });
</script>
